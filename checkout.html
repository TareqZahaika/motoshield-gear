<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout | MotoShield Gear</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/supabase.js"></script>
    <script defer src="js/cart.js"></script>
    <script defer src="js/main.js"></script>
    <script defer src="js/ai-assistant.js"></script>
  </head>
  <body data-page="checkout">
    <header class="site-header"></header>
    <main class="page">
      <section class="page-title"><p class="eyebrow">Secure demo checkout</p><h1>Checkout</h1><p>No real payment is processed. The selected payment method is saved to Supabase.</p></section>
      <section class="checkout-layout">
        <form class="form-card" id="checkoutForm">
          <label>Full name<input name="full_name" required></label>
          <label>Email<input name="email" type="email" required></label>
          <label>Phone number<input name="phone" required></label>
          <label>Address<textarea name="address" required></textarea></label>
          <label>Payment method<select name="payment_method" required><option>Credit Card</option><option>PayPal</option><option>Cash on Delivery</option><option>Bank Transfer</option></select></label>
          <label>Order notes<textarea name="order_notes" placeholder="Delivery notes or customization details"></textarea></label>
          <button class="btn primary" type="submit">Place demo order</button>
          <p class="form-message" id="checkoutMessage"></p>
        </form>
        <aside class="summary"><h2>Checkout summary</h2><div id="checkoutItems"></div><div class="summary-line total"><span>Total</span><strong id="checkoutTotal">$0</strong></div></aside>
      </section>
    </main>
    <footer class="site-footer"></footer>
    <div id="aiAssistant"></div>
  </body>
</html>
