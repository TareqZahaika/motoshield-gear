<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | MotoShield Gear</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/supabase.js"></script>
    <script defer src="js/cart.js"></script>
    <script defer src="js/main.js"></script>
    <script defer src="js/ai-assistant.js"></script>
  </head>
  <body data-page="admin">
    <header class="site-header"></header>
    <main class="page">
      <section class="page-title"><p class="eyebrow">Demo admin</p><h1>Products and orders dashboard</h1><p>For class presentation only. In production, this page must require real authentication and admin authorization.</p></section>
      <section class="admin-grid">
        <article class="metric"><span>Products</span><strong id="adminProducts">0</strong></article>
        <article class="metric"><span>Orders</span><strong id="adminOrders">0</strong></article>
        <article class="metric"><span>Messages</span><strong id="adminMessages">0</strong></article>
      </section>
      <section class="records-panel"><h2>Product catalog preview</h2><div class="product-grid" id="adminProductsGrid"></div></section>
      <section class="records-panel"><h2>Recent orders</h2><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Status</th><th>Total</th><th>Payment</th></tr></thead><tbody id="adminOrdersTable"></tbody></table></div></section>
    </main>
    <footer class="site-footer"></footer>
    <div id="aiAssistant"></div>
  </body>
</html>
